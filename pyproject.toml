[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noise-conditioned-trajectory-diffusion"
version = "0.1.0"
description = "Noise-conditioned convolution and local trajectory objectives for pixel-space diffusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=1.13.1,<3", "numpy>=1.23,<2", "Pillow>=9.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
